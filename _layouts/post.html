---
layout: default
---

<article class="post">
  <div class="post-shell">
    <div class="post-main">
      <p class="post-meta-line">
        <span>{{ page.date | date: "%b %-d, %Y" }}</span>
        {% if page.categories and page.categories.size > 0 %}
        <span class="dot" aria-hidden="true">&bull;</span>
        <span class="caps">{{ page.categories | join: " | " }}</span>
        {% endif %}
      </p>

      <h1 class="post-title">{{ page.title }}</h1>

      {% if page.tags %}
      <div class="tag-row">
        {% for tag in page.tags %}
        <span class="tag-chip">{{ tag }}</span>
        {% endfor %}
      </div>
      {% endif %}

      <div class="post-body">
        {{ content }}
      </div>
    </div>

    <aside id="post-toc" class="toc-card" aria-label="Table of contents"></aside>
  </div>
  <button id="toc-toggle" class="toc-toggle" type="button" aria-expanded="false" aria-controls="post-toc"
    aria-label="Toggle table of contents">
    <svg viewBox="0 0 24 24" role="presentation">
      <path
        d="M4 5.5c0-.55.45-1 1-1h14a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm0 6c0-.55.45-1 1-1h8a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm0 6c0-.55.45-1 1-1h14a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Z" />
    </svg>
  </button>
</article>
<script>
  (function () {
    const tocRoot = document.getElementById('post-toc');
    const postBody = document.querySelector('.post-body');
    if (!tocRoot || !postBody) return;

    const headings = Array.from(postBody.querySelectorAll('h2, h3, h4'));
    if (headings.length === 0) { tocRoot.remove(); document.getElementById('toc-toggle')?.remove(); return; }

    const rootList = document.createElement('ul');
    rootList.className = 'toc-list';
    const headingMap = new Map();
    let currentH2Li = null;
    let currentH3Li = null;

    headings.forEach((h, i) => {
      if (!h.id) h.id = `section-${i + 1}`;
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = `#${h.id}`; a.textContent = h.textContent;
      let tocItem = null;

      if (h.tagName === 'H2') {
        li.className = 'toc-item';
        li.appendChild(a);
        rootList.appendChild(li);
        currentH2Li = li;
        currentH3Li = null;
        tocItem = li;
      } else if (h.tagName === 'H3' && currentH2Li) {
        let sub = currentH2Li.querySelector('ul') || document.createElement('ul');
        sub.className = 'toc-list depth-2';
        const subLi = document.createElement('li');
        subLi.className = 'toc-item depth-2';
        subLi.appendChild(a);
        sub.appendChild(subLi);
        if (!currentH2Li.contains(sub)) currentH2Li.appendChild(sub);
        currentH3Li = subLi;
        tocItem = subLi;
      } else if (h.tagName === 'H4' && currentH3Li) {
        let sub2 = currentH3Li.querySelector('ul') || document.createElement('ul');
        sub2.className = 'toc-list depth-3';
        const subLi2 = document.createElement('li');
        subLi2.className = 'toc-item depth-3';
        subLi2.appendChild(a);
        sub2.appendChild(subLi2);
        if (!currentH3Li.contains(sub2)) currentH3Li.appendChild(sub2);
        tocItem = subLi2;
      }

      if (tocItem) headingMap.set(h.id, tocItem);
    });

    tocRoot.innerHTML = '<div class="toc-title">Contents</div>';
    tocRoot.appendChild(rootList);

    const tocToggle = document.getElementById('toc-toggle');
    if (tocToggle) {
      tocToggle.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopImmediatePropagation();
        const isOpened = tocRoot.classList.toggle('open');
        document.body.classList.toggle('toc-open', isOpened);
      });
    }

    // Scroll spy that stays stable when scrolling up/down.
    let activeId = null;
    const clearActive = () => {
      document.querySelectorAll('.toc-item.active').forEach(el => el.classList.remove('active'));
    };

    const setActive = (id) => {
      if (!id || id === activeId) return;
      clearActive();
      headingMap.get(id)?.classList.add('active');
      activeId = id;
    };

    const getCurrentHeadingId = () => {
      const offset = Math.max(120, window.innerHeight * 0.22);
      let current = headings[0];

      for (const h of headings) {
        if ((h.getBoundingClientRect().top - offset) <= 0) current = h;
        else break;
      }

      return current?.id || null;
    };

    let ticking = false;
    const updateActive = () => {
      ticking = false;
      setActive(getCurrentHeadingId());
    };

    const requestUpdate = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(updateActive);
    };

    window.addEventListener('scroll', requestUpdate, { passive: true });
    window.addEventListener('resize', requestUpdate, { passive: true });
    window.addEventListener('hashchange', requestUpdate);
    requestUpdate();

    document.addEventListener('click', (e) => {
      if (tocRoot.classList.contains('open') && !tocRoot.contains(e.target) && !tocToggle?.contains(e.target)) {
        tocRoot.classList.remove('open');
        document.body.classList.remove('toc-open');
      }
    });
  })();
</script>
